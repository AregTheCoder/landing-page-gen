picsart_specific:
  - two panels side by side: a darkened source photo with white corner brackets, and the cropped result at 9:16
  - the size or format label under the brackets (x2, Story, 1080 x 1920 px) drawn by lp-compose
  - a tool icon (expand arrows, Instagram glyph) on the black or white ground beside the source
  - the result panel is the same photograph re-anchored on the subject, not a second photo
prompt_guidance: >
  One person, full body, centred in an urban setting with a graphic backdrop: flat coloured wall,
  stadium seats or road markings from above. Natural daylight, streetwear contrasting with the
  backdrop. Plain photograph, no text, brackets, rulers, handles or grids.
open:
  - 'layout: no stock picture carries the exact two-panel split with a bracketed, dimmed source beside its own crop; the splits found are two different views, the nested crops are prints held by a hand'
  - 'layout: Pexels and Unsplash have no frame-within-a-frame over a person in streetwear on a coloured wall; the two frame-prop portraits are studio poses with the frame in the subject''s hands'
  - Frank Flores's "woman standing in front of a row of bleachers" fits df6f0107 but is Unsplash+ premium, not the free licence; dropped
  - no free match found for the exact top-down view of a figure on yellow diamond road markings (5f91c6aa); the two road examples are frontal or half-body
  - Collins Lesulie and Beer Drinker are mostly landscape shooters; their single matching photos are kept but they are not listed as creators
  - ANNIE HATUANH, Nurlan Tortbayev, helloiamtugce and SAAD EMRIS profiles were not fetched
layout:
  arrangement: >
    Two unequal panels in a square, one hard vertical divide. Left: a small dimmed source on black
    ground, white corner brackets on the subject. Right: the same photograph enlarged full-bleed.
    The ground holds an icon and a size label.
  repetition: >
    One photograph twice, not two photographs: the same subject small and bracketed, then large
    and re-anchored. The repeat is the framing itself, so a set of such pairs from one shoot is
    the asset.
  search_terms:
    - hand holding polaroid in front of the same landscape
    - photo print held against the scene it shows
    - diptych two panels same street scene
    - split image two halves side by side
    - woman holding empty picture frame coloured backdrop
    - instant photo framing mountain view
    - picture within a picture composition
