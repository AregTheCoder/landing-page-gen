picsart_specific:
  - rounded template card with the headline set in one display face above the photo and an optional call to action
  - four black icon tiles (layout, checkerboard, move, Aa) stacked beside the card on the white ground
  - 'black-ground variant: magenta tile, aura gradient swatch and checkerboard cutout of the same product beside the card'
  - product cut out and re-composited onto a flat colour or aura gradient inside the card; sparkle glyphs
  - flyer-maker example (7c5d6f7d) uses a line illustration and a type specimen instead of a photograph
prompt_guidance: >
  One product, alone or held in one hand, front-on, centred on flat colour or soft aura gradient, even light,
  25% margin. Only the brief's headline and call-to-action as poster type, one typeface. No card, table,
  perspective, shadow, paper texture, logos.
open:
  - 7c5d6f7d is a line illustration with a type specimen, not a photograph; no stock genre collected for that variant.
  - Unsplash search pages return gradient wallpapers for product+pastel terms; the strong hand-held jar results there
    (Virginia Marinova) are Unsplash+ paid and were dropped.
  - Jievani's, Jonathan Borba's and MART PRODUCTION's portfolios are not product-on-colour as a body of work; only
    the single photos are cited.
  - 'layout: no stock picture carries the asymmetric split (one large card beside a column of small tiles); every
    match found is an even grid, so that proportion stays Picsart''s.'
  - 'layout: matches are printed or hung objects. A flat panel grid on a transparent or pure white ground exists
    on stock only as another product''s UI, which was not collected.'
layout:
  arrangement: >
    Two zones on one flat ground: a column of three or four equal small squares at left, one large rounded card,
    two thirds of the frame, at right. Even gutters, no dividers, no perspective, same corner radius throughout.
  repetition: >
    One subject repeats across the panels: the same product shows up as a cutout tile, a colour swatch and again
    finished inside the big card. A serial set of one framing in several colours reads the same way.
  search_terms:
    - paint sample cards grid
    - polaroid photos grid flat lay
    - vintage poster grid wall
    - film strip contact sheet
    - art prints grid white wall
    - color swatch cards top view
    - framed artwork even grid display
