picsart_specific:
  - rounded 5:4 or 16:10 card on a white or light-grey ground, kept from the source page
  - white selection handles at the corners and mid-edges with a 3x3 grid overlay
  - large black arrow cursor and a row of black glyph chips under the card
  - text overlays are design chrome (logo wordmark, poster headline, text box), never part of the photo
  - before-after split with a soft-blurred left half on the enhancer tile
prompt_guidance: >
  Kept from source; nothing is generated. If templated later: one still-life subject (flower in
  hand, chair, iced drink) centred on a plain single-hue seamless, soft even studio light,
  editorial finish, no text, room for chrome.
open:
  - no match for a hand-held peony on a saturated teal-blue seamless; dark or black backdrops only
  - no black cane-back armchair on a sage wall; plain wooden chairs on green walls stand in
  - no iced coffee with a striped paper straw alone on blush pink without props
  - Planet Volumes' green-on-green armchair (Unsplash) is an Unsplash+ premium file, excluded
  - Unsplash image URLs are kept as served, with their tracking parameters
