picsart_specific:
  - black ground (light grey on ai-models and compare pages) with tool or model tiles beside the photo
  - resolution chip (4K, 2K, 1080p) and model-name pill drawn by lp-compose, never in the photo
  - 3:4 photo crop with rounded corners; 2x2 variant grid of the same subject on some callouts
  - two-panel comparison of the same prompt on compare-models pages, one pill per panel
category_convention: >
  Competitor model pages usually show a single generated hero image inside a dark card with
  the model name; not verified in this pass.
prompt_guidance: >
  One editorial photograph of a single subject (product, person or hand-held object) filling
  the centre two thirds of a 3:4 frame, on a clean bright pastel, white or sky backdrop, sharp
  and saturated. No text, logos, borders, collages, split screens or UI.
open:
  - No Pexels or Unsplash match found for pastel gradient two-tone lipstick tubes on cream seamless; nearest are pink monochrome flat lays.
  - No verified match for a coloured-cap bottle held against sky with a large fictional label; sky-bottle results carry real brands.
  - Unsplash search pages returned few usable studio fashion results; the fashion side is Pexels only.
  - Layout, no match for the asymmetric one-big-panel plus 2x2 thumb grid built from a *product*; every grid found tiles a person or a landscape.
  - Layout, the closest triptychs and photo-series (Valeriia Miller, Mohammad Alizade, Olivie Strauss) are Unsplash+ premium, so they were left out.
  - Layout, smartphone side-by-side comparisons dominate split-screen searches; skipped as another product's UI.
layout:
  arrangement: >
    A square canvas cut into two to six rectangular panels, all showing the same subject.
    Either one dominant panel takes half to three quarters of the frame with a column or 2x2
    grid of smaller equal panels beside it, or two equal halves meet on a hard vertical seam.
    Gutters are a few pixels of flat black; corners rounded; dark chrome pills along the bottom
    edge or in the rail.
  repetition: >
    One subject photographed four or five times: different angle, crop and scale, same backdrop,
    light and palette in every panel. The serial set is the asset; the dominant panel is the
    closest crop of the same object.
  search_terms:
    - product photo collage grid
    - contact sheet photo grid
    - diptych two panel
    - photo booth strip
    - split screen before after same subject
    - collage of one model different expressions
    - film strip mosaic portraits
    - photo grid same subject different angles
