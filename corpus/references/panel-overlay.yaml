picsart_specific:
  - dark rounded HSL panel lower right with title, eight colour chips and Hue/Saturation/Lightness sliders with values
  - hero variant: white round badge with the HSL logo and a white pill reading HSL, upper right
  - tilted-card ground: photo card over a plain card rotated about 10 degrees on the white page
  - rounded corners on the 4:3 or 5:4 slot, subject kept in the left two thirds
category_convention: >
  Adjustment-tool pages on competitor sites also lay a floating slider panel over a stock
  portrait; the portrait is unedited stock and the panel implies the edit.
prompt_guidance: >
  Stock fashion photograph, one person, face visible, bold garment colour on flat backdrop
  (striped wall, seamless yellow, magenta-cyan light). Hard light, high saturation. Subject
  left two thirds, plain backdrop lower right. No panel, sliders, recolouring, text, second
  person.
open:
  - e9c17dd8 (woman in iridescent fringe top, arms raised, high-key) not found on Pexels or Unsplash; Vika Glitter 33798239 is the nearest genre match.
  - 9caa06ad source is inferred from the Unsplash description "Girl in rainbow skirt"; not pixel-verified.
  - R. Fera, Nuta Sorokina, Max Mishin and Isabela Kronemberger profiles are mostly landscapes, monochrome, wildlife or product, so they are examples only, not genre creators.
  - layout gap - no stock picture on either platform carries a dark rounded UI-style control panel laid over a photo; the closest free-licence arrangements are flat wall blocks and printed ad panels.
  - layout gap - the tilted-card variant (9caa06ad and e9c17dd8, a second plain rounded card offset and rotated behind the photo) was not found as a single frame; Polina 6551894 is the nearest, with torn paper instead of a card.
layout:
  arrangement: >
    One photograph fills the frame, corners rounded, and a single opaque dark rounded rectangle
    is laid over one corner: about half the width and a third to a half of the height, anchored
    to that edge. The subject sits in the opposite two thirds, so the rectangle covers only flat
    backdrop and never the face. No gutter, no divider, no second picture; the hero variant swaps
    the panel for a round badge and a pill in the upper right, and two cards set a second plain
    rounded card offset behind the photo, rotated about ten degrees.
  repetition: >
    One panel design repeated over four different portraits on the same page, same size, same
    corner radius, same title, with only the slider row changing (Hue, Saturation, Lightness).
    The set of four cards is the asset; the photographs underneath are unrelated.
