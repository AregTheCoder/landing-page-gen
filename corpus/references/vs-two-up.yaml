picsart_specific:
  - two equal panels side by side, each a rounded tile, on a light-grey, white or black ground
  - model pill under or over each panel with the provider logo and model name
  - a circular VS badge on the seam between the panels
  - size and ratio chips (1024x1024, 2k, 1x1, 3x4) under each panel
  - the same prompt rendered twice, so subject, prop and palette repeat across both panels
  - a large invented brand word on the product when the section tests text rendering
category_convention: >
  Model-comparison pages elsewhere also show identical-prompt pairs, usually portrait and product-with-text,
  so the reader judges skin, typography and prompt adherence at a glance.
prompt_guidance: >
  One subject, centred in the middle two thirds: a studio portrait on seamless or gradient, or one product on
  seamless or a single bold prop under hard light. Saturated colour, crisp texture. Same prompt both panels.
  No text unless `> text:` names it; never model names, VS badge or logos.
open:
