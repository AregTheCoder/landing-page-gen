    - man outdoors portrait greenery blur
    - sneaker on cafe table blurred
    - woman park bench portrait sunlight
    - takeaway cup wooden table cafe
    - portrait garden natural light front facing
    - perfume bottle table window light
    - lifestyle product cafe bokeh background
