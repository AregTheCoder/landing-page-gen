by: reference-collector
photography:
  genre: >
    Casual environmental portraits and lifestyle product shots. One person, waist-up, front-on, looking at
    the lens, head in the centre third, in a sunlit park or street with greenery or a wall softly blurred
    behind; or one takeaway-sized product (a cup, a bottle) standing on a cafe table with the room or street
    dissolving into warm bokeh. Natural daylight, natural colour, shallow depth of field, no props, no text.
  search_terms:
    - woman portrait park arms crossed
    - woman park portrait looking at camera
    - man arms crossed outdoors portrait
    - woman standing outdoors portrait front
    - iced coffee cup cafe table
    - iced latte cafe bokeh
    - perfume bottle on table bokeh
    - single sneaker on table blurred background
