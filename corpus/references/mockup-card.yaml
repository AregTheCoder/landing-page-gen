picsart_specific:
  - black ground with the 3:4 source photo on the left and a rounded card on the right
  - dark profile card with a round avatar crop of the same subject, blue check badge, placeholder name and counts
  - white product card holding the remove_bg cutout, a price chip and an ORDER button
  - checkerboard transparency half and magenta check chip on the cutout panel
  - glyph chips bottom-left; all text drawn by lp-compose, none in the photo
category_convention: >
  Background-remover and e-commerce tool pages usually show a cutout dropped into a shop listing or avatar
  mockup; the source photo is an ordinary phone-style snapshot with a busy background, not a studio shot.
prompt_guidance: >
  One person or one product in a real environment, front-on, head or product in the centre third, waist-up
  for people, 3:4. Natural daylight, natural colour, background softly blurred (park lawn and trees, or a cafe
  with warm bokeh). No text, no logos, no UI, no second subject, no props competing with the subject.
layout:
  arrangement: >
    Square frame, dark gutter, two rounded panels. Narrow left column: the tall source photo with small
    label tiles stacked below. Wider right panel: the same subject restated on a pale ground with
    placeholder text beneath it.
  repetition: >
    One subject twice at two scales: the full frame on the left, then the same face or product cropped to a
    circle or lifted onto a clean ground on the right.
  search_terms:
    - hand holding printed photo in front of same scene
    - phone screen showing the object beside it
    - product next to its packaging box beige background
    - smartphone standing beside vase clean surface
    - polaroid photos arranged on table
    - framed print held against plain wall
    - person holding photo of building
