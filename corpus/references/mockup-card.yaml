open:
  - No Unsplash portrait with a sunlit open lawn behind the subject was free; the close matches on Unsplash+ were dropped.
  - No verified example of a takeaway cup in front of a shopfront with warm street bokeh, the exact ec67a479 backdrop.
  - Nguyễn Tiến Thịnh's and William Chen's profiles were not a fit for creators (William Chen's is mostly landscapes).
  - Layout, no stock picture carries the family's exact square two-column split of rounded panels; the
    closest are photo-in-photo scenes, device mockup scenes and product-beside-packaging pairs.
  - Layout, candidates whose screen showed another product's editor or a social app (Lightroom on a tablet,
    Instagram profiles, a live-stream overlay) were dropped as another product's UI.
  - Layout, the best hand-held-polaroid-against-the-beach frames on Unsplash were Unsplash+ premium and were
    dropped.
