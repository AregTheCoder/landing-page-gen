picsart_specific:
  - black ground (or a checkerboard filling the whole ground) with two 2:3 cutout panels stacked left and a 3:4 result right
  - the grey-and-dark checkerboard behind the cutouts, drawn by lp-compose, never photographed
  - magenta check badges on the cutout panels and a black pill button (Add to bag, Download, Apply to all)
  - cutouts placed with fit contain, no shadow or halo under them
  - the result panel may be a collage (paper texture, flat-lay garments, template headline) rather than a clean studio shot
category_convention: >
  Background-remover pages (remove.bg, Canva, Adobe Express) show one subject on a grey-and-white
  checkerboard beside the original photo; Picsart's variant adds a second cutout and a finished scene.
prompt_guidance: >
  Panels A, B: one product or person alone, centred on plain mid-grey seamless, soft even
  light, no labels, no props; background removed afterwards, never a painted checkerboard,
  halo or shadow. Panel C: same subject, clean 3:4 studio scene, no text.
