picsart_specific:
  - black ground (or a checkerboard filling the whole ground) with two 2:3 cutout panels stacked left and a 3:4 result right
  - the grey-and-dark checkerboard behind the cutouts, drawn by lp-compose, never photographed
  - magenta check badges on the cutout panels and a black pill button (Add to bag, Download, Apply to all)
  - cutouts placed with fit contain, no shadow or halo under them
  - the result panel may be a collage (paper texture, flat-lay garments, template headline) rather than a clean studio shot
category_convention: >
  Background-remover pages (remove.bg, Canva, Adobe Express) show one subject on a grey-and-white
  checkerboard beside the original photo; Picsart's variant adds a second cutout and a finished scene.
prompt_guidance: >
  Panels A, B: one product or person alone, centred on plain mid-grey seamless, soft
  light, no labels or props; background removed later, never a painted checkerboard,
  halo or shadow. Panel C: same subject, clean 3:4 studio scene, no text.
open:
  - No Pexels or Unsplash match for the pink flower-filled cabinet on blue (b95353fc); the closest is a plain flowers-on-pastel-blue shot.
  - No verified free portrait with hands framing the face on white; the two portraits found are grey or white backdrops without that gesture.
  - Curated Lifestyle's Lisianthus-in-jar on pale blue (6HljH9l5zSE) fits but is Unsplash+ premium, so dropped.
  - Pexels and Unsplash profile summaries come from the first page of each gallery, not the whole body of work.
  - Layout pass: no free match for the family's signature split, a narrow rail of two small panels beside one large panel; every collage found is a uniform grid or a scatter.
  - Layout pass: the strongest serial sets (identical rubber stamps, a portrait series in a car, a three-frame negative) are all Unsplash+ premium, so dropped.
  - Layout pass: arrangements were read from each photo page's description; no file was opened, so panel counts on the Unsplash collages are unverified.
layout:
  arrangement: >
    Two or three flat panels sharing one ground, no perspective. The usual split is a narrow
    left rail of two stacked small panels against one large panel filling the right two thirds;
    the variant staggers three rounded panels diagonally. The gutter is bare ground, black or
    dark grey, wide and even.
  repetition: >
    One subject carries every panel: the same cap, the same face, the same flower-filled locker
    appears in the rail and again in the large panel, each time at a different crop or state
    (on its backdrop, isolated, finished). Two colourways of one product count as the same motif.
