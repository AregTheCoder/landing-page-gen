photography:
  genre: >
    One dessert or small product, whole and centred, photographed straight on
    or slightly above at eye level. Bright, even, soft studio light with no
    hard shadow; crisp edges that cut out cleanly. The backdrop is plain:
    seamless white, a solid colour, or a softly blurred scene behind the
    same subject.
