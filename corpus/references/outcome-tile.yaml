picsart_specific:
  - rounded 16:10 tile on white, or the light checkerboard for the transparent outcome
  - the same cutout repeated across the row; only the ground changes
  - the blurred and new-scene grounds are made with picsart_change_bg from the same cutout
  - no shadow under the subject on the transparent state
category_convention: >
  Not researched in this pass.
prompt_guidance: >
  One product or food item, whole and centred, photographed straight on with
  soft, even studio light and no hard shadow, on a seamless plain backdrop
  with crisp edges. No text, no UI, no props, no second subject. Keep the
  same item for every tile; vary only the backdrop (white, solid colour,
  blurred scene, new scene).
open:
  - No Pexels or Unsplash photo matches the blurred-scene ground (cbd078ac) or garden ground (db63aad8) with the same cutout; those grounds are made by the tool, not shot.
  - No shadowless transparent-state reference exists on stock sites; the isolated-on-white shots all keep a faint contact shadow.
  - Competitor category convention not researched.
