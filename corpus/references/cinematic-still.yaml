family: cinematic-still
collected: 2026-09-08
by: reference-collector
photography:
  genre: >
    Single-subject vertical frames that read like film stills: one person, dish or prop, centred or on a
    third, shallow depth. Light is deliberate and coloured (teal-orange or red-blue split, warm golden hour,
    fairy-light bedroom glow) or bold complementary studio colour (yellow food on blue seamless). The grade is
    unified and saturated, the finish glossy, no chrome or text.
  search_terms:
    - cinematic portrait vertical
    - teal orange portrait moody
    - colorful food photography blue background
    - golden hour portrait film
    - neon pink bedroom portrait
    - surreal miniature photography
