picsart_specific:
  - no ground and no chrome; the frame fills a rounded-corner 9:16 tile
  - tiles come in sets that share one grade and read as a reel
  - surreal photographic composites (a tiny person asleep in a coffee cup) alongside straight stills
  - commercial brightness: even the moody frames are lifted, glossy and saturated, never murky
  - safe margin top and bottom for the page's rounded corners
category_convention: >
  Competitor AI-model pages (Midjourney, Runway, Kling showcases) use the same 9:16 or 1:1 gallery of
  single-subject filmic stills; not verified in this pass.
prompt_guidance: >
  One cinematic frame, 9:16, a single subject (person, dish or prop) with shallow depth of field. Choose one
  grade for the whole set: teal-orange split light, golden hour, or monochrome; or bold complementary studio
  colour on a seamless. Glossy commercial finish, safe margin top and bottom. No letterbox bars, borders,
  subtitles, watermarks, logos, collages or mixed grades.
open:
  - No Pexels or Unsplash match for the surreal composite register (tiny figure inside a coffee cup); only pastel prop surrealism found.
  - Unsplash cinematic-portrait results are mostly Unsplash+ (plus.unsplash.com); three such hits were dropped, leaving one Unsplash example.
  - Pexels photo pages do not state dimensions, so portrait orientation was taken from the search filter and description, not confirmed.
  - The Y2K pink-bedroom unboxing register (029d49e5) is matched only loosely by coloured-practical bedroom portraits.
