picsart_specific:
  - flat saturated ground (violet, coral, tomato red, lime, warm ivory) replacing the photo backdrop
  - two or three flat circles or torn-paper shapes behind the cutout, in clashing colours
  - one or two loose black brush strokes behind the subject
  - hard cutout edge with no drop shadow; subject cropped at the tile edge
  - a diagonal yellow stripe or black disc as a poster accent
prompt_guidance: >
  One subject only: a person mid-gesture in a single bold colour, or one product, waist-up or
  centred, even studio light, clean hard edge. Plain saturated seamless, no scene, no drop
  shadow, no text; ground and shapes come later.
open:
  - No free Pexels or Unsplash photo of a charm necklace under hard flash on a red seamless; jewellery results are soft-lit flat lays.
  - No candle on coloured paper in warm daylight; the closest match is white-on-white.
  - Strong yellow-seamless male portraits found were Unsplash+ (Getty), so excluded.
  - Sound On's profile is mostly video; the photo is kept, the creator is not listed.
