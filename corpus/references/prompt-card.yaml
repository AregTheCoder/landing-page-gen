picsart_specific:
  - the dark prompt card with the truncated prompt sentence and a white "Generate" button
  - model icon tiles stacked in a column beside the result
  - a play triangle over the result when it stands in for a clip
  - black ground (light grey on ai-models use-case strips)
  - a "before" snapshot (messy desk) paired above the polished result on 22f9b181
  - colour pushed past natural: magenta birds, teal sky, chrome liquid type over the flowers
prompt_guidance: >
  One subject filling a 3:4 or 1:1 frame, commercial finish: a glossy object on a plinth among pastel
  blocks in soft studio light, or saturated peony or pink bird on clean sky. Sharp focus; no text,
  buttons, cursors or UI.
open:
  - No Pexels or Unsplash match for a coloured ceramic mug raised on a plinth among pastel blocks at
    eye level; closest are a teal mug on a marble block and pastel podium flat-lays.
  - No stock match for the surreal grade of 6e1c292f (magenta birds on a teal storm sky); all
    flamingo pairs are natural daylight.
  - Liquid chrome 3D type over the peonies (802fe719) is a rendered effect, not photography; not searched.
layout:
  arrangement: >
    Two to four rounded panels on a black gutter. One panel is the large finished picture; the others
    are smaller: a dark text card, an icon square, or the same subject raw or cut out. Unequal split.
  repetition: >
    The same subject twice in one frame: the raw snapshot and the polished result; the same lettering
    over the photo and again on a transparency checkerboard.
  search_terms:
    - photo collage wall mixed sizes
    - half renovated facade before after
    - framed prints on black wall
    - gallery wall large and small frames
    - open magazine spread text and photo
    - photobooth strip repeated frames
    - three prints in a row on a wall
