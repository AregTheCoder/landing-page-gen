picsart_specific:
  - light-grey (or white) ground around a rounded 5:4 tile, kept from source
  - one large render plus a row of three small chips: black model-mark tile, two detail crops of the same render
  - model mark (logo) in a black chip; never painted by a model
  - video renders carry a centred white play button
  - some cards wrap the render in a mock ad or app layout with headline and CTA text as chrome
category_convention: >
  Model hub pages of competing AI tools show a similar card: one showcase render per model with
  the model's logo, usually a fashion or portrait subject in saturated colour.
prompt_guidance: >
  Kept from source; nothing is generated. If templated later, the render is a surreal
  fashion editorial: one styled model, saturated colour-blocked outfit, bright daylight, blue
  sky or clouds, one surreal twist, photo-real. No text, logos or chips in the render.
open:
  - No Pexels or Unsplash match for the exact giant-model-in-a-ruined-city composition of c3cbf8c8.
  - No free match for a model with a dog on an alpine meadow with oversized flowers (1794ea79); results were lifestyle, not editorial.
  - Pastel pink bob in clouds (c02d25a9) matched only partly; closest were studio shots with props.
  - Unsplash+ premium photos (plus.unsplash.com) were excluded as not covered by the free licence.
