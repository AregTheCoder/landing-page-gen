picsart_specific:
  - black ground (or none on hero pairs) holding two 1:1 panels side by side, rounded corners
  - Before and After pills drawn by lp-compose in the bottom-left of each panel
  - the before is the same photo degraded (blurred, downscaled) or with its original background; never a second photo
  - the after keeps the exact framing of the before; only sharpness, size or background changes
  - subject kept out of the bottom-left 30 % where the pill sits
prompt_guidance: >
  One subject only, ordinary snapshot finish: a portrait on a pastel seamless, socks and sandals on a pastel
  backdrop, or a cap on grass. Soft, slightly dull, centred, clear of the bottom-left. No text, arrows or splits.
open:
