picsart_specific:
  - black ground (or none on hero pairs) holding two 1:1 panels side by side, rounded corners
  - Before and After pills drawn by lp-compose in the bottom-left of each panel
  - the before is the same photo degraded (blurred, downscaled) or with its original background; never a second photo
  - the after keeps the exact framing of the before; only sharpness, size or background changes
  - subject kept out of the bottom-left 30 % where the pill sits
prompt_guidance: >
  One subject only, ordinary snapshot finish: a portrait on a pastel seamless, socks and sandals on a pastel
  backdrop, or a cap on grass. Soft, slightly dull, centred, clear of the bottom-left. No text, arrows or splits.
open:
  - No Pexels or Unsplash match for the exact 69ed3f5c scene (flowers tucked into socks on pastel blue); nearest are plain heels-and-socks studio shots.
  - Nothing verified for a cap shot low in golden-hour backlight on grass; both cap matches are flat daylight.
  - Unsplash searches for "cap grass" and "woman portrait pastel studio" returned only grass textures or Unsplash+ premium items.
  - Layout: Pexels carries no two-panel before/after arrangement at all (it rejects collages); every layout example below is Unsplash.
  - Layout: the renovation and hair before/after splits are Unsplash+ premium (Getty, Fellipe Ditadi), so none were taken.
  - Layout: nothing free matches the modal wide card (small before panel plus a large applied-mockup result) or the black icon-tile cell.
  - Layout: half-and-half wipe frames were skipped on purpose; the family's Never line bars wipes and sliders.
layout:
  arrangement: >
    Two or three flat rectangles on one ground, parted by an empty gutter, no divider graphic. Either an equal
    pair, stacked or side by side, or a small panel plus a larger result panel. One subject, framed alike,
    throughout.
  repetition: >
    One photograph repeated: identical framing in the before panel and the after panel, then a third time
    inside the large result panel as an applied print, poster or product shot.
