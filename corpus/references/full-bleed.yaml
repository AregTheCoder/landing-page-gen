photography:
  genre: >
    One uninterrupted picture that fills the slot. Two genres: editorial people shots (a single
    model, beauty or fitness, on a solid seamless in vivid or pastel colour, even studio light,
    head-and-shoulders or half body) and clean object or scene shots (one product or hand-held
    object centred on a saturated seamless, or a workspace in window light, raking shadow, safe
    margin all round).
  search_terms:
    - woman studio portrait blue background
    - beauty portrait pastel background
    - fitness woman dumbbell studio
    - product photography colored background minimal
    - person working desk natural light
    - still life objects hard shadow
    - woman braid portrait old town
