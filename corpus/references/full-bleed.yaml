picsart_specific:
  - no ground: the picture fills the slot edge to edge, cropped by lp-inject to the slot ratio
  - compare-models tiles pair two full-bleed panels with a model-name chip (chrome, not photography)
  - comic and story heroes are illustrations, sometimes in a circular mask on black
  - subject centred with safe margin so hero, gallery and 3:2 crops all survive
  - saturated seamless in the page's accent colour rather than white
category_convention: >
  Competitor tool pages use the same two genres: a single-model editorial on a coloured seamless for
  heroes, and one-object or workspace shots for tutorial and use-case thumbnails.
prompt_guidance: >
  One editorial photograph filling the whole frame at the slot's ratio: one subject, one light source,
  a solid seamless or one clean setting, subject centred with safe margin on every side. People: even
  studio light, vivid or pastel seamless, head-and-shoulders or half body. Objects: one product or hand-held
  object, raking light, hard shadow. No collage, split, border, vignette, logo, UI or text beyond the brief's strings.
open:
  - No Pexels or Unsplash match for the crayon-style village illustration (a70e6579); only a photographic subject analogue was found.
  - No free freckled beauty portrait on a pale mint seamless with a tool in hand; nearest matches are purple or blue grounds.
  - Fitness portraits on a saturated blue seamless in red kit were not found; matches split across backdrop and subject.
