# Attribution (models.made_by): an image a page presents as a model's output is
# generated on that model. `connector` is the connector's model ids
# (picsart_model_catalog, 2026-09-23); a model-page slug (ai-models--<x>, the
# sides of compare-models--<a>-vs-<b>) is its id with punctuation dropped, else
# `slugs` names it. A slug in `unavailable` is a model Picsart pages advertise
# that the connector cannot run: its images cannot be generated truthfully.
# `audio` pages' pictures are illustrations, not model output. A slug in none of
# these (ambiguous: `kling`, `sora`, `pixverse` name several ids) stops the brief
# until it is added here.
