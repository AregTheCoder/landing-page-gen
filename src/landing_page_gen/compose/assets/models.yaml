# The models Picsart hosts, as the model-picker list names them (the corpus's
# ai-models--* page titles), in the order a picker fills its other rows: the
# page's own model is the active row, the rest are same-kind siblings from
# other makers, those with a mark first. `logo` names a maker mark in logos/;
# `id` is the model on the b05f6314 connector.
#
# Each mark is cropped from a corpus composite that shows it white on a dark
# tile (source + box, reference pixels) and keyed to white-on-transparent by
# `lp-compose --extract-logos`; the picker draws it beside the name as the
# originals do (a3502ec3 recraft-v4-styles-pro-vector S07, 4eeca13c recraft-v4-1
# S07). A model with no mark gets a disc with its initial.
logos:
  openai:
    src: corpus/pages/ai-models--gpt-image-1/media/01328a85-1ef4-4291-bda6-b247ea4a0134-60707f42.avif
    box: [60, 60, 450, 450]
  recraft:
    src: corpus/pages/ai-models--recraft-v4-1/media/4eeca13c-c557-4579-ba17-e4cfd90a76ec-a81fb75e.avif
    box: [40, 450, 335, 740]
  gemini:
    src: corpus/pages/ai-models--recraft-v4-1/media/4eeca13c-c557-4579-ba17-e4cfd90a76ec-a81fb75e.avif
    box: [40, 860, 335, 1150]
  bfl:
    src: corpus/pages/ai-models--recraft-v4-1/media/4eeca13c-c557-4579-ba17-e4cfd90a76ec-a81fb75e.avif
    box: [40, 40, 335, 335]
  ideogram:
    src: corpus/pages/ai-models--recraft-v4-1/media/4eeca13c-c557-4579-ba17-e4cfd90a76ec-a81fb75e.avif
    box: [40, 1265, 335, 1560]
  seed:
    src: corpus/pages/ai-models/media/22f9b181-cc90-4c98-a686-924284ddf7e5-a84dbcc5.webp
    box: [85, 388, 138, 435]
  xai:
    src: corpus/pages/ai-models--grok-imagine/media/537bdb6c-e205-4bf7-baf4-0ba678b70264-206e179a.avif
    box: [100, 1300, 420, 1570]
